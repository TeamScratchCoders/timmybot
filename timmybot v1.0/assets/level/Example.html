<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            --xp: 10;
            --maxXp: 100;
            --xpString: "10/100";
        }

        .rapper {
            width: 2006px;
            height: 578px;
            background-image: url(./Stars.png);
            position: fixed;
        }

        .container {
            margin: 75px;
            width: auto;
            height: calc(100% - 150px);
            background-color: #FFF3;
            border-radius: 75px;
            border: 2px solid #FFF4;
            backdrop-filter: blur(25px);
            box-shadow: 30px 30px 30px #0008;
            display: flex;
            align-items: center;
        }

        .avatarContainer {
            height: calc(100% - 100px);
            width: fit-content;
            margin: 47.5px;
            padding: 5px;
            background: linear-gradient(125deg, #FFF3 50%, #0F7 100%);
            box-shadow: 
                calc(.57px * 30) calc(.82px * 30) 30px #0F72,
                20px 20px 0px #0004;
            border-radius: 100%;
        }

        .avatar {
            height: 100%;
            border-radius: 100%;
        }

        .info {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin: 0 47px;
        }
        .bar {
            content: "";
            background-color: #0006;
            padding: 10px;
            width: calc(100% - 20px);
            margin-top: 10px;
            display: flex;
            border-radius: 100px;
        }
        .bar::before {
            content: "";
            background-color: #0F7;
            box-shadow:
                0px 0px 50px #0F4,
                0px 0px 150px #0F4;
            height: 50px;
            border-radius: 100px;
            width: max(calc(100% * (var(--xp) / var(--maxXp))), 50px)
        }

        .bar::after {
            content: var(--xpString);
            font-family: 'Roboto Slab', serif;
            font-weight: 800;
            font-size: 40px;
            color: #FFF;
            position: absolute;
            text-align: center;
            width: calc(100% - 47px - 105px - 328px);
        }
        .line {
            display: flex;
            flex-direction: row;
        }
        .line::before, .line::after {
            content: "";
            width: 50%;
            height: 10px;
            background-color: #FFF;
            margin: auto 0;
            box-shadow: 
                0px 5px 0 #0F45;
        }
        h1 {
            font-family: 'Roboto Slab', serif;
            font-weight: 900;
            font-size: 125px;
            color: #FFF;
            text-shadow: 
                -1px 3px 0 #0F45,
                1px 3px 0 #0F46;
            text-align: center;
            text-wrap: nowrap;
            margin: 0 30px;
        }
        h2 {
            font-family: 'Roboto Slab', serif;
            font-weight: 200;
            font-size: 75px;
            color: #FFF;
            text-shadow: 
                -1px 3px 0 #0F49,
                1px 3px 0 #0F49;
        }
    </style>
</head>

<body>
    <div class="rapper">
        <div class="container">
            <div class="avatarContainer">
                <img src="https://cdn.discordapp.com/avatars/715043871503024218/1726bede78ab0bb4df7c4ee88b220ed2.webp?size=160" class="avatar">
            </div>
            <div class="info">
                <div class="line">
                    <h1>Ian R.</h1>
                </div>
                <div class="xp">
                    <h2>LEVEL: 12</h2>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
